<body>

     <div class="container">

       <div class="menu">

                <img src="./image/logo3.png" alt="logo da empresa">
                <h1>Bem-vindo(a)!</h1>

            <div class="nav-bar">
                <a href="./painel.html" class="nav-item">

    <div  class="box">
        <h1>BobIA</h1>
        <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
        <br><br>
        <button onclick="gerarResposta()">Gerar Resposta</button>
        <h3>Resposta da IA:</h3>
        <div id="resposta"></div>
    </div>
    </div>
    </div>

    <script>
        
function abrirBobIA() {
    document.getElementById("janelaBobIA").style.display = "block";
}
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>

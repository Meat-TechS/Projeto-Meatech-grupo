<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style-login.css">
    <title>meatech</title>
</head>

<body>

  <header class="cabecalho">

    <div class="logo2">
        <img src="./img/logo2.png" alt="Logo2">
    </div>
    
     <div class="menu">
     <ul>
            <li><a href="../site.html">Home  </a></li>
   <li><a href="../../simulador-financeiro/calculadora.html">Simulação </a></li>
    <li><a href="./login.html">Login </a></li>
  
     </ul>
   </div>
</header>

    <div class="card_erro" id="cardErro"> 
               Login realizado com sucesso! 
            </div>

    <div class="login">

        <div class="coluna_esquerda">
            <h2>Faça o seu login!</h2>

            <div class="cadastro_empresa_link">
                <p>A sua empresa ainda não tem conta? <a href="cadastro.html">Cadastre sua empresa</a></p>
            </div>

        <div class="campo">
            <h6>Digite o e-mail ou CNPJ</h6>
            <input type="text" id="input_validacao">
            <div class="error" id="login-required-error">Campo obrigatório</div>
        </div>

        <div class="campo">
            <h6>Digite a sua senha</h6>
            <input type="password" id="input_senha" placeholder="Mínimo de 8 caracteres">
            <div class="error" id="senha-required-error">Campo obrigatório</div>
            <div class="error" id="login-invalid-error">E-mail, CNPJ ou senha inválidos</div>

            
        </div>


        <div class="loginbutton">
            <button onclick="login()">Login</button>
        </div>
    </div>


    <div class="coluna_direita">
        <div class="logo1">
            <img src="img/logo1.png" alt="Logo1">
        </div>
    </div>

    </div>
    </div>
   
<script src="./js/login.js"></script>

</body>

</html>
